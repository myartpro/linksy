<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linksy – povezani na pravi način</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#f2f3fa;--card:#fff;--ink:#14162b;--mut:#666b88;--line:#e3e5f2;--acc:#6a4cff;--acc2:#12c2a5;--hov:#eceefa;--danger:#e5484d;color-scheme:light}
:root[data-theme="dark"]{--bg:#0d0f1f;--card:#171a31;--ink:#eef0ff;--mut:#9aa0c4;--line:#292d4d;--acc:#8b74ff;--hov:#20244a;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1f;--card:#171a31;--ink:#eef0ff;--mut:#9aa0c4;--line:#292d4d;--acc:#8b74ff;--hov:#20244a;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);align-items:center;gap:12px;padding:8px 16px;height:60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:31}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.logo b{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-size:20px}
.sbox{position:relative;max-width:260px}
.sbox input{border-radius:99px;padding-left:14px;margin-left:6px;width:calc(100% - 6px)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-radius:12px;padding:8px 18px;font-size:20px;color:var(--mut);position:relative}
.tab:hover{background:var(--hov)}
.tab[aria-selected="true"]{color:var(--acc)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-9px;height:3px;border-radius:3px;background:var(--acc)}
.acts{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--hov);position:relative;font-size:18px}
.bd{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:0 5px;font-weight:600}
.lay{display:grid;grid-template-columns:260px minmax(0,640px) 280px;gap:20px;justify-content:center;padding:18px 16px 90px}
.side{position:sticky;top:78px;align-self:start;display:grid;gap:4px;max-height:calc(100dvh - 90px);overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none;overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.lnk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:none;border:0;width:100%;text-align:left;font-weight:600}
.lnk:hover{background:var(--hov)}
.on{position:relative}
.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#2fd17b;border:2px solid var(--card)}
.btn{border:0;border-radius:99px;padding:9px 18px;font-weight:600;background:var(--acc);color:#fff}
.btn.g{background:var(--hov);color:var(--ink)}
.btn.s{padding:6px 14px;font-size:13.5px}
.mut{color:var(--mut);font-size:13px}
.stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.story{flex:none;width:112px;height:180px;border-radius:16px;border:0;color:#fff;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;text-align:left;font-weight:600;font-size:13px;overflow:hidden}
.story .av{position:absolute;top:10px;left:10px;border:3px solid var(--acc2)}
.story.add{background:var(--card);color:var(--ink);border:1px solid var(--line);align-items:center;justify-content:center;gap:6px}
.story.add i{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:24px}
.comp{display:flex;gap:10px;align-items:center}
.comp button.fake{flex:1;text-align:left;background:var(--bg);border:0;border-radius:99px;padding:12px 16px;color:var(--mut)}
.post .h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post .h b{display:block;line-height:1.2}
.post p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.post img.pi{width:100%;border-radius:14px;max-height:520px;object-fit:cover;margin-bottom:10px}
.cnt{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pa{display:flex;gap:4px;padding-top:6px;position:relative}
.pa>div{flex:1;position:relative}
.pa button{width:100%;border:0;background:none;border-radius:10px;padding:8px;font-weight:600;color:var(--mut)}
.pa button:hover{background:var(--hov)}
.pa button.me{color:var(--acc)}
.rx{position:absolute;bottom:100%;left:0;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 8px;display:none;gap:2px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:5}
.pa>div:hover .rx,.pa>div:focus-within .rx{display:flex}
.rx button{width:auto;font-size:24px;padding:2px 5px;transition:transform .12s}
.rx button:hover{transform:scale(1.3) translateY(-4px)}
.cm{display:flex;gap:8px;margin-top:10px}
.cm .b{background:var(--bg);border-radius:14px;padding:6px 12px;overflow-wrap:anywhere}
.cm .b b{font-size:13px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.g .card{margin:0}
.cover{height:200px;border-radius:18px 18px 0 0;background:linear-gradient(120deg,var(--acc),var(--acc2));margin:-16px -16px 0}
.pf{display:flex;gap:16px;align-items:end;margin-top:-50px;padding-bottom:6px;flex-wrap:wrap}
.pf .av{border:5px solid var(--card)}
.itm .im{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:48px;background:var(--hov);margin-bottom:8px;overflow:hidden}
.itm .im img{width:100%;height:100%;object-fit:cover}
.pill{background:var(--hov);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);width:min(520px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 40px 80px -20px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(10,8,30,.65);backdrop-filter:blur(3px)}
.dg{padding:22px;display:grid;gap:12px;position:relative}
.dg h2{margin:0;font-size:22px;text-align:center}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--hov)}
.dock{position:fixed;right:16px;bottom:calc(0px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end;z-index:25}
.cw{width:320px;height:420px;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 10px 40px -10px rgba(0,0,0,.4)}
.cw header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cw header b{flex:1;font-size:14px}
.cw header button{border:0;background:var(--hov);width:32px;height:32px;border-radius:50%}
.ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.bb{max-width:80%;padding:7px 12px;border-radius:16px;background:var(--hov);overflow-wrap:anywhere}
.bb.me{align-self:flex-end;background:var(--acc);color:#fff}
.cw form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
#callD{width:min(920px,calc(100vw - 16px));background:#0b0c18;color:#fff}
.vw{position:relative;aspect-ratio:16/10;background:#000;border-radius:22px 22px 0 0;overflow:hidden}
#rv{width:100%;height:100%;object-fit:cover}
#lv{position:absolute;right:14px;bottom:14px;width:26%;max-width:220px;border-radius:14px;border:2px solid rgba(255,255,255,.7);background:#222;transform:scaleX(-1);object-fit:cover}
#rw{position:absolute;inset:0;display:grid;place-items:center;text-align:center;gap:8px;align-content:center}
.cc{display:flex;justify-content:center;gap:14px;padding:16px}
.cc button{width:54px;height:54px;border-radius:50%;border:0;background:#2a2d48;color:#fff;font-size:22px}
.cc button.off{background:#fff;color:#111}
.cc button.end{background:var(--danger)}
#inc{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;z-index:60;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);display:flex;gap:12px;align-items:center}
#inc[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#241a55;color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.lay{grid-template-columns:minmax(0,640px) 280px}#left{display:none}}
@media(max-width:820px){.lay{grid-template-columns:minmax(0,1fr)}#right{display:none}.top{grid-template-columns:auto 1fr auto;height:auto;flex-wrap:wrap}.sbox{display:none}.tabs{grid-column:1/-1;order:3;justify-content:space-between;overflow-x:auto}.tab{padding:8px 12px}.cw{width:calc(100vw - 20px)}.dock{right:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{background:radial-gradient(900px 500px at 8% -5%,rgba(106,76,255,.16),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(18,194,165,.14),transparent 55%),var(--bg);background-attachment:fixed}
.top{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
body::before{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(16px)}
.logo b{box-shadow:0 8px 20px -6px var(--acc)}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:24px;box-shadow:0 1px 2px rgba(20,22,43,.04),0 14px 34px -18px rgba(60,50,140,.28);transition:box-shadow .2s,transform .2s}
.post:hover{box-shadow:0 1px 2px rgba(20,22,43,.05),0 22px 44px -18px rgba(60,50,140,.38)}
.tab{border-radius:14px;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.tab[aria-selected="true"]::after{display:none}
.btn{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)));box-shadow:0 8px 18px -8px var(--acc);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.g{background:var(--hov);box-shadow:none}
.ib{transition:background .15s,transform .15s}.ib:hover{transform:scale(1.07)}
.story{border-radius:20px;transition:transform .18s;box-shadow:0 14px 26px -16px rgba(40,30,100,.6)}
.story:hover{transform:translateY(-3px)}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45),transparent 55%);pointer-events:none}
.story>*{position:relative;z-index:1}.story .av{position:absolute}
.story.add::after{display:none}
.post img.pi{transition:transform .35s;border-radius:18px}
.post button:hover img.pi{transform:scale(1.015)}
.av{box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--acc) 35%,transparent)}
.comp .av,.cw .av,.cm .av,.lnk .av{box-shadow:none}
.lnk{border-radius:14px;transition:background .15s}
.cw{border-radius:22px 22px 0 0;box-shadow:0 20px 50px -16px rgba(30,20,90,.55)}
.cw header{background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 14%,transparent),color-mix(in srgb,var(--acc2) 12%,transparent))}
.bb.me{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)))}
dialog{border-radius:26px}
.cover{height:230px;border-radius:24px 24px 0 0}
.ph{border:0;padding:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--hov);display:block;transition:transform .2s}
.ph:hover{transform:scale(1.04)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.dg label{display:grid;gap:4px;font-weight:600;font-size:14px}
#iv{display:inline-block;border-radius:10px}
.bb{position:relative}.dm{border:0;background:none;opacity:0;margin-left:6px;font-size:12px;cursor:pointer;color:inherit;padding:0}.bb:hover .dm,.dm:focus-visible{opacity:.9}
@media(hover:none){.dm{opacity:.7}}
</style>
</head>
<body>
<header class="top">
<div class="row"><div class="logo"><b>L</b><span>Linksy</span></div><div class="sbox"><input id="q" type="search" placeholder="Išči po Linksyju" aria-label="Iskanje"></div></div>
<nav class="tabs" role="tablist" id="tabs"></nav>
<div class="acts"><button class="ib" id="th" aria-label="Svetla/temna tema">◐</button><button class="ib" id="nb" aria-label="Obvestila">🔔<span class="bd" id="nc"></span></button><button class="ib" id="meb" aria-label="Moj profil" style="padding:0;background:none"></button></div>
</header>
<div class="lay"><aside class="side" id="left"></aside><main id="main"></main><aside class="side" id="right"></aside></div>
<div class="dock" id="dock"></div>

<dialog id="dC"><div class="dg"><button class="x" data-x aria-label="Zapri">✕</button><h2>Ustvari objavo</h2>
<div class="row" id="cme"></div><textarea id="ct" rows="4" maxlength="1000" placeholder="O čem razmišljaš?" aria-label="Besedilo objave"></textarea>
<img id="cp" alt="" style="display:none;width:100%;border-radius:12px;max-height:240px;object-fit:cover">
<label class="btn g" style="text-align:center">📷 Dodaj fotografijo<input id="cf" type="file" accept="image/*" hidden></label>
<button class="btn" id="cpost">Objavi</button></div></dialog>
<dialog id="dN"><div class="dg"><button class="x" data-x aria-label="Zapri">✕</button><h2>Obvestila</h2><div id="nl"></div></div></dialog>
<dialog id="dS"><div class="dg"><button class="x" data-x aria-label="Zapri">✕</button><h2>Zgodba</h2><div id="sv"></div></div></dialog>
<dialog id="dQ"><div class="dg"><button class="x" data-x aria-label="Zapri">✕</button><h2>Rezultati iskanja</h2><div id="ql"></div></div></dialog>
<dialog id="dF"><div class="dg"><button class="x" data-x aria-label="Zapri">✕</button><h2 id="fh"></h2><div id="ff" class="dg" style="padding:0"></div></div></dialog>
<dialog id="callD"><div class="vw"><video id="rv" autoplay playsinline></video><div id="rw"><span id="ra"></span><b id="rn"></b><span class="mut" id="rs">Povezovanje …</span></div><video id="lv" autoplay muted playsinline></video></div>
<div class="cc"><button id="bm" aria-label="Mikrofon">🎤</button><button id="bc" aria-label="Kamera">📹</button><button class="end" id="be" aria-label="Končaj klic">✆</button></div></dialog>
<input type="file" id="fAv" accept="image/*" hidden><input type="file" id="fCv" accept="image/*" hidden><input type="file" id="fGal" accept="image/*" multiple hidden>
<dialog id="dI" style="width:min(96vw,1500px)"><div class="dg"><button class="x" data-x aria-label="Zapri">✕</button><div style="overflow:auto;max-height:calc(100dvh - 150px);margin-top:34px;text-align:center"><img id="iv" alt="Fotografija" style="max-width:100%;max-height:calc(100dvh - 160px);cursor:zoom-in"></div><div class="mut" id="ivc" style="text-align:center"></div><button class="btn g" id="idel" style="color:var(--danger)">🗑 Izbriši fotografijo</button></div></dialog>
<dialog id="dA"><div class="dg"><h2 id="ah">Prijava v Linksy</h2>
<div class="row" style="gap:6px;justify-content:center"><button class="btn s" id="atl">Prijava</button><button class="btn g s" id="atr">Nov račun</button></div>
<label>Uporabniško ime<input id="aun" autocomplete="username" maxlength="20"></label>
<label>Geslo<input id="apw" type="password" autocomplete="current-password" maxlength="100"></label>
<label id="apl" hidden>Ponovite geslo<input id="apw2" type="password" autocomplete="new-password" maxlength="100"></label>
<div id="aer" role="alert" style="color:var(--danger);min-height:1.3em;font-size:14px"></div>
<button class="btn" id="ago">Prijava</button>
<p class="mut" style="margin:0">E-pošte ne potrebujete. Geslo si zapomnite: strežnik ga hrani samo v zakriti obliki, zato ga ni mogoče obnoviti.</p></div></dialog>
<div id="inc" hidden role="alert"><span id="incn"></span><button class="btn s" id="ia">Sprejmi</button><button class="btn g s" id="id">Zavrni</button></div>
<div class="toast" id="toast" role="status"></div>

<script>
const API="";/* ← sem prilepite naslov Cloudflare Workerja, npr. https://linksy.vase-ime.workers.dev */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),3000)};
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?"zdaj":m<60?m+" min":m<1440?Math.floor(m/60)+" h":Math.floor(m/1440)+" d"};
const RX={like:"👍",love:"❤️",haha:"😂",wow:"😮",sad:"😢",angry:"😡"},RN={like:"Všeč mi je",love:"Obožujem",haha:"Haha",wow:"Vau",sad:"Žalostno",angry:"Jezen"};
const m=60000,now=Date.now();
function seed(){return{me:{id:"me",n:"Vi",bio:"",img:"",cover:"",gallery:[]},people:[],friends:[],req:[],sug:[],groups:[],items:[],events:[],posts:[],stories:[],notifs:[],chat:{},clean:1}}
let S;try{S=JSON.parse(localStorage.getItem("linksy")||"null")}catch(e){}if(!S||!S.people)S=seed();
let tab="home",pv="me";const save=()=>{try{localStorage.setItem("linksy",JSON.stringify(S))}catch(e){toast("Shranjevanje ni uspelo (premalo prostora). Uporabite manjše slike.")}};
const sv=(a,b,k)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x2="0" y2="1"><stop offset="0" stop-color="hsl(${a},70%,58%)"/><stop offset="1" stop-color="hsl(${b},75%,78%)"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/><circle cx="${520+k*70}" cy="${110+k*15}" r="46" fill="#fff" opacity=".85"/><path d="M0 500V${300+k*12}l140-120 120 100 150-170 170 190 100-80 120 80V500z" fill="hsl(${a},38%,32%)" opacity=".8"/><path d="M0 500V400l200-90 180 80 200-110 220 120V500z" fill="hsl(${b},45%,22%)"/></svg>`);
if(!S.clean){S.people=[];S.friends=[];S.req=[];S.sug=[];S.out=[];S.stories=[];S.groups=[];S.items=[];S.events=[];S.notifs=[];S.chat={};S.posts=(S.posts||[]).filter(p=>p.a==="me");if(S.me&&S.me.bio==="Dobrodošli na mojem profilu.")S.me.bio="";S.clean=1;save()}
if(!S.nobot){Object.keys(S.chat||{}).forEach(k=>{S.chat[k]=S.chat[k].filter(m=>m.f)});S.nobot=1;save()}
const P=id=>id==="me"?S.me:S.people.find(p=>p.id===id)||{id,n:"Neznan",h:200};
const av=(p,s=40)=>`<span class="av" style="width:${s}px;height:${s}px;font-size:${s*.42}px;background:${U(p.img)?`center/cover url('${esc(U(p.img))}')`:`linear-gradient(150deg,hsl(${p.h||250} 65% 52%),hsl(${((p.h||250)+50)%360} 70% 40%))`}">${U(p.img)?"":esc((p.n||"?")[0])}</span>`;
const IMG={};

function shrink(f,max=900){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("Datoteke ni mogoče prebrati"));r.onload=()=>{const i=new Image();i.onerror=()=>rej(new Error("To ni veljavna slika"));i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};i.src=r.result};r.readAsDataURL(f)})}

 if(d.t==="offer"&&!pc){inc=d;$("#incn").textContent=d.n+" vas kliče ("+(d.v?"video":"glas")+")";$("#inc").hidden=false}

let DB=null,curView=null;
function idb(){return DB||(DB=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("IndexedDB ni na voljo"));const r=indexedDB.open("linksy-img",1);r.onupgradeneeded=()=>r.result.createObjectStore("i");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
const tx=(m,fn)=>idb().then(d=>new Promise((res,rej)=>{const t=d.transaction("i",m),q=fn(t.objectStore("i"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("Shranjevanje ni uspelo"))}));
function prep(f,max){return new Promise((res,rej)=>{if(!f.type.startsWith("image/"))return rej(new Error("To ni slika"));const u=URL.createObjectURL(f),i=new Image();i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Slike ni mogoče prebrati"))};i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);(async()=>{for(const q of [.92,.82,.72,.6]){const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(b&&(b.size<=4500000||q===.6))return res(b)}rej(new Error("Pretvorba slike ni uspela"))})()};i.src=u})}
async function saveImg(f,max=1600){const b=await prep(f,max),id="idb:"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);try{await tx("readwrite",s=>s.put(b,id))}catch(e){throw new Error("Brskalnik ne dovoli shranjevanja slik (zasebni način ali poln prostor).")}IMG[id]=URL.createObjectURL(b);return id}
async function dropImg(id){if(!id||!id.startsWith("idb:"))return;try{await tx("readwrite",s=>s.delete(id))}catch(e){}if(IMG[id]){URL.revokeObjectURL(IMG[id]);delete IMG[id]}}
async function loadImgs(){try{await tx("readonly",s=>{const q=s.openCursor();q.onsuccess=()=>{const c=q.result;if(c){IMG[c.key]=URL.createObjectURL(c.value);c.continue()}};return q})}catch(e){}}

 fr.f.forEach(id=>{if(!ids.has(id))S.people.push({id,n:"Član",bio:"",img:"",cover:"",gallery:[],h:200})});S.friends=fr.f.slice();S.req=[];S.out=[];S.sug=[];S.stories=[];
